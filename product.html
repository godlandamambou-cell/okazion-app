<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail de l'offre — Okazion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col">
    <header class="bg-[#131921] text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-[1500px] mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="bg-[#ff9900] text-[#131921] font-extrabold text-xl px-2.5 py-0.5 rounded-md">O</div>
                <span class="text-2xl font-extrabold tracking-tight">okazion<span class="text-[#ff9900] text-sm">.store Détail</span></span>
            </a>
            <a href="index.html" class="text-xs font-bold text-[#ff9900] hover:underline">
                <i class="fa-solid fa-arrow-left mr-1"></i> Retour au catalogue
            </a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 w-full flex-1">
        <div id="product-detail-container" class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-gray-200 grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="animate-pulse bg-gray-200 h-80 rounded-xl"></div>
            <div class="space-y-4 animate-pulse">
                <div class="h-6 bg-gray-200 rounded w-3/4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                <div class="h-10 bg-gray-200 rounded w-full mt-6"></div>
            </div>
        </div>
    </main>

    <script>
        const ENV = {
            SUPABASE_URL: "https://xvrhubmhscaazmhytmla.supabase.co",
            SUPABASE_ANON_KEY: "sb_publishable_EQB1DluDwn4QT58HJt6hJg_Bw170zA1"
        };
        const supabaseClient = window.supabase.createClient(ENV.SUPABASE_URL, ENV.SUPABASE_ANON_KEY);

        const baseProducts = [
            { id: 1, title: "Location Robe de Mariée Sirène Dentelle Haute Couture", category: "Mode", city: "Paris", condition: "Neuf", mode: "Location", price: 120.00, unit: "/ jour", rating: 4.9, verified: true, vedette: true, image: "https://images.unsplash.com/photo-1594552072238-b8a3478cbecd?auto=format&fit=crop&q=80&w=600" },
            { id: 2, title: "Apple iPhone 15 Pro Max 256Go Titane Naturel (Débloqué)", category: "High-Tech", city: "Kinshasa", condition: "Neuf", mode: "Achat", price: 980.00, unit: "", rating: 4.8, verified: true, vedette: true, image: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&q=80&w=600" },
            { id: 3, title: "Sony PlayStation 5 Slim Édition Standard + 2 Manettes DualSense", category: "High-Tech", city: "Paris", condition: "Neuf", mode: "Achat", price: 520.00, unit: "", rating: 5.0, verified: true, vedette: true, image: "https://images.unsplash.com/photo-1606813907291-d86efa9b94db?auto=format&fit=crop&q=80&w=600" },
            { id: 4, title: "Produit Collector Erable Digital", category: "High-Tech", city: "Kinshasa", condition: "Neuf", mode: "Achat", price: 22.00, unit: "", rating: 5.0, verified: true, vedette: false, image: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&q=80&w=600" },
            { id: 5, title: "Location SUV Toyota Land Cruiser Prado TXL avec Chauffeur", category: "Véhicules", city: "Kinshasa", condition: "Très bon état", mode: "Location", price: 95.00, unit: "/ jour", rating: 4.7, verified: true, vedette: false, image: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&q=80&w=600" },
            { id: 6, title: "Canapé d'Angle Scandinave 4 Places Tissu Velours Gris", category: "Maison", city: "Lyon", condition: "Très bon état", mode: "Retrait", price: 490.00, unit: "", rating: 4.6, verified: false, vedette: false, image: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&q=80&w=600" },
            { id: 7, title: "Tensiomètre Électronique Brassard Médical Haute Précision", category: "Santé", city: "Kinshasa", condition: "Neuf", mode: "Achat", price: 42.00, unit: "", rating: 4.9, verified: true, vedette: false, image: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&q=80&w=600" }
        ];

        let currentProduct = null;

        async function loadProductDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                window.location.href = 'index.html';
                return;
            }

            // 1. Interroger Supabase en priorité
            if (supabaseClient) {
                const { data, error } = await supabaseClient
                    .from('annonces')
                    .select('*')
                    .eq('id', productId)
                    .single();

                if (!error && data) {
                    currentProduct = {
                        id: data.id,
                        title: data.title,
                        category: data.category || 'High-Tech',
                        city: data.city || 'Kinshasa',
                        condition: data.condition || 'Neuf',
                        mode: data.mode || 'Achat',
                        price: parseFloat(data.price || 0),
                        unit: data.unit || (data.mode === 'Location' ? '/ jour' : ''),
                        rating: 5.0,
                        verified: true,
                        image: data.image || (Array.isArray(data.gallery) && data.gallery[0]) || 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&q=80&w=600'
                    };
                }
            }

            // 2. Si absent de Supabase, vérifier dans le localStorage
            if (!currentProduct) {
                let customProducts = JSON.parse(localStorage.getItem('okazion_custom_products')) || [];
                currentProduct = customProducts.find(p => String(p.id) === String(productId));
            }

            // 3. Si toujours absent, vérifier dans les produits de base
            if (!currentProduct) {
                currentProduct = baseProducts.find(p => String(p.id) === String(productId));
            }

            const container = document.getElementById('product-detail-container');

            if (!currentProduct) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-gray-500">Offre introuvable ou supprimée.</div>`;
                return;
            }

            container.innerHTML = `
                <div class="relative rounded-2xl overflow-hidden bg-gray-100 h-96 shadow-md">
                    <img src="${currentProduct.image}" alt="${currentProduct.title}" class="w-full h-full object-cover">
                    <span class="absolute top-4 left-4 bg-[#ff9900] text-[#131921] font-extrabold text-xs px-3 py-1 rounded shadow">${currentProduct.mode}</span>
                </div>
                <div class="space-y-6 flex flex-col justify-between">
                    <div class="space-y-3">
                        <div class="flex items-center justify-between text-xs text-gray-500">
                            <span class="flex items-center gap-1 font-bold text-red-500"><i class="fa-solid fa-location-dot"></i> ${currentProduct.city}</span>
                            <span class="bg-gray-100 px-2 py-1 rounded font-semibold">${currentProduct.condition}</span>
                        </div>
                        <h1 class="text-xl sm:text-2xl font-extrabold text-gray-900">${currentProduct.title}</h1>
                        <div class="flex items-center gap-2 text-xs text-amber-500 font-bold">
                            <i class="fa-solid fa-star"></i> <span>${currentProduct.rating || 5.0} / 5</span>
                            ${currentProduct.verified ? `<span class="text-emerald-600 ml-2"><i class="fa-solid fa-circle-check"></i> Vendeur Pro Vérifié</span>` : ''}
                        </div>
                        <div class="text-3xl font-extrabold text-[#b12704] pt-2">
                            ${currentProduct.price} € <span class="text-sm font-normal text-gray-500">${currentProduct.unit || ''}</span>
                        </div>
                        <p class="text-xs text-gray-600 leading-relaxed">
                            Offre vérifiée sur Okazion.store. Garantie de paiement sécurisé à la livraison, par Mobile Money ou par Carte Bancaire.
                        </p>
                    </div>
                    <div class="space-y-3 pt-4 border-t">
                        <button onclick="addToCartAndRedirect()" class="w-full bg-[#ff9900] hover:bg-[#e88b00] text-[#131921] font-bold py-3.5 rounded-xl text-sm shadow transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cart-shopping"></i> Ajouter au panier et commander
                        </button>
                        <a href="messages.html" class="block text-center w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 rounded-xl text-sm transition">
                            <i class="fa-solid fa-comments mr-2"></i> Contacter le vendeur
                        </a>
                    </div>
                </div>
            `;
        }

        function addToCartAndRedirect() {
            if (!currentProduct) return;
            let cart = JSON.parse(localStorage.getItem('okazion_cart')) || [];
            let existing = cart.find(item => String(item.id) === String(currentProduct.id));
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...currentProduct, qty: 1 });
            }
            localStorage.setItem('okazion_cart', JSON.stringify(cart));
            window.location.href = 'cart.html';
        }

        window.onload = () => {
            loadProductDetail();
        };
    </script>
</body>
</html>
