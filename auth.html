<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion & Inscription — Okazion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl p-8 shadow-xl max-w-md w-full space-y-6 border border-gray-200">
        <div class="text-center space-y-2">
            <a href="index.html" class="inline-flex items-center gap-2">
                <div class="bg-[#ff9900] text-[#131921] font-extrabold text-xl px-2.5 py-0.5 rounded-md">O</div>
                <span class="text-2xl font-extrabold tracking-tight">okazion<span class="text-[#ff9900] text-sm">.store</span></span>
            </a>
            <h1 id="form-title" class="text-xl font-extrabold text-gray-900">Connexion à votre compte</h1>
            <p class="text-xs text-gray-500">Accédez à votre vitrine, vos messages et vos commandes.</p>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Adresse Email</label>
                <input type="email" id="auth-email" required placeholder="nom@exemple.com" class="w-full border rounded-xl px-4 py-2.5 text-xs outline-none focus:ring-2 focus:ring-[#ff9900]">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Mot de passe</label>
                <input type="password" id="auth-password" required placeholder="••••••••" class="w-full border rounded-xl px-4 py-2.5 text-xs outline-none focus:ring-2 focus:ring-[#ff9900]">
            </div>

            <button type="submit" id="auth-submit-btn" class="w-full bg-[#ff9900] hover:bg-[#e88b00] text-[#131921] font-extrabold py-3 rounded-xl text-xs shadow-lg transition uppercase tracking-wider">
                Se connecter
            </button>
        </form>

        <div class="text-center text-xs space-y-3">
            <button onclick="toggleMode()" id="toggle-mode-btn" class="text-gray-600 hover:text-[#ff9900] font-semibold transition block w-full">
                Pas encore de compte ? S'inscrire
            </button>

            <!-- Bouton de Connexion Google -->
            <div class="pt-3 border-t">
                <button onclick="signInWithGoogle()" class="w-full bg-white hover:bg-gray-50 text-gray-700 font-bold py-3 rounded-xl text-xs border border-gray-300 shadow-sm transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-google text-red-500"></i> Continuer avec Google
                </button>
            </div>
        </div>
    </div>

    <script>
        const ENV = {
            SUPABASE_URL: "https://xvrhubmhscaazmhytmla.supabase.co",
            SUPABASE_ANON_KEY: "sb_publishable_EQB1DluDwn4QT58HJt6hJg_Bw170zA1"
        };
        const supabaseClient = window.supabase.createClient(ENV.SUPABASE_URL, ENV.SUPABASE_ANON_KEY);
        
        let isSignUp = false;

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('form-title').innerText = isSignUp ? "Créer un compte Okazion" : "Connexion à votre compte";
            document.getElementById('auth-submit-btn').innerText = isSignUp ? "S'inscrire" : "Se connecter";
            document.getElementById('toggle-mode-btn').innerText = isSignUp ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const btn = document.getElementById('auth-submit-btn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Traitement...';

            if (isSignUp) {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    alert("Erreur d'inscription : " + error.message);
                } else {
                    alert("Inscription réussie ! Vérifiez vos emails si nécessaire ou connectez-vous.");
                    isSignUp = false;
                    toggleMode();
                }
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    alert("Erreur de connexion : " + error.message);
                } else {
                    alert("Connexion réussie ! Redirection...");
                    window.location.href = 'profile.html';
                }
            }
            btn.disabled = false;
            btn.innerText = isSignUp ? "S'inscrire" : "Se connecter";
        }

        async function signInWithGoogle() {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/profile.html'
                }
            });
            if (error) {
                alert("Erreur de connexion Google : " + error.message);
            }
        }
    </script>
</body>
</html>
